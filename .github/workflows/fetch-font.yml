# 글꼴 받기: 에스코어드림(S-Core Dream, 무료 배포)을 눈누 CDN 에서 받아 앱 글꼴 폴더에 넣고 커밋한다 (작업 환경에서 바깥 다운로드가 막혀 있어 Actions 가 대신)
name: Fetch font
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SCDream 3 · 5 · 6 받기
        run: |
          set -e
          cd app/src/main/assets/fonts
          echo "== 패키지 파일 목록 =="; curl -fsSL "https://data.jsdelivr.com/v1/package/gh/projectnoonnu/noonfonts_six@1.0/flat" | python3 -c "import json,sys; [print(f['name']) for f in json.load(sys.stdin)['files'] if 'ore' in f['name'] or 'SCD' in f['name']]" || true
          get() { # get <저장이름> <후보 URL...>
            out="$1"; shift
            for u in "$@"; do
              if curl -fsSL "$u" -o "$out"; then echo "받음: $u"; file "$out"; ls -la "$out"; return 0; fi
              echo "없음: $u"
            done
            echo "모든 후보 실패: $out"; return 1
          }
          B="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.0"
          get SCDream3.woff "$B/S-CoreDream-3Light.woff" "$B/SCDream3.woff" "$B/S-CoreDream-3Light.woff2"
          get SCDream5.woff "$B/S-CoreDream-5Medium.woff" "$B/SCDream5.woff" "$B/S-CoreDream-5Medium.woff2"
          get SCDream6.woff "$B/S-CoreDream-6Bold.woff" "$B/SCDream6.woff" "$B/S-CoreDream-6Bold.woff2"
          python3 - <<'PY'
          for w in (3, 5, 6):
              b = open(f"SCDream{w}.woff", "rb").read(4); assert b == b"wOFF", (w, b)
          print("ok")
          PY
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/fonts/SCDream*.woff
          git commit -m "글꼴: 에스코어드림(S-Core Dream) 3 · 5 · 6 woff 추가 (눈누 CDN, 무료 배포 글꼴)" || echo "변경 없음"
          git push
