# 글꼴 받기: 에스코어드림(S-Core Dream, 무료 배포) woff 를 받아 화면보호기 폴더(앱 원본 + PC 사본)에 넣고 커밋한다 — APK 없이 PC 가 TV 로 보낼 수 있게 (작업 환경에서 바깥 다운로드가 막혀 있어 Actions 가 대신)
name: Fetch font
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SCDream 5 · 6 받기
        run: |
          set -e
          cd app/src/main/assets/screensaver
          # 1) 정해진 후보 → 2) 모자라면 GitHub 코드 검색으로 그 파일명을 가진 공개 저장소를 찾아 raw 로 받는다
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          NAMES = {5: "S-CoreDream-5Medium", 6: "S-CoreDream-6Bold"}   # 위젯 본문 500 · 굵게 700
          CAND = ["https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.0/{n}.woff", "https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six/{n}.woff",
                  "https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/{n}.woff", "https://astra.nrf.re.kr/fonts/home/user/{n}.woff"]
          def get(u):
              try:
                  r = urllib.request.Request(u, headers={"User-Agent": "curl/8"}); d = urllib.request.urlopen(r, timeout=30).read()
                  if d[:4] == b"wOFF": return d
                  print("woff 아님:", u, d[:12])
              except Exception as e: print("없음:", u, e)
          tok = os.environ.get("GH_TOKEN", "")
          def search(n):
              try:
                  r = urllib.request.Request("https://api.github.com/search/code?per_page=20&q=" + urllib.parse.quote(f'"{n}.woff" in:path'),
                                             headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "User-Agent": "curl/8"})
                  j = json.load(urllib.request.urlopen(r, timeout=30))
                  for it in j.get("items", []):
                      if it["path"].endswith(n + ".woff"):
                          yield f'https://raw.githubusercontent.com/{it["repository"]["full_name"]}/HEAD/{it["path"]}'
              except Exception as e: print("검색 실패:", n, e)
          for w, n in NAMES.items():
              out = f"SCDream{w}.woff"; d = None
              for u in [c.format(n=n) for c in CAND]:
                  d = get(u)
                  if d: print("받음:", u, len(d)); break
              if not d:
                  for u in search(n):
                      d = get(u)
                      if d: print("받음(검색):", u, len(d)); break
              assert d, "못 받음: " + n
              open(out, "wb").write(d)
          print("ok")
          PY
          cp SCDream5.woff SCDream6.woff ../../../../../pc/tvrelay/screensaver/      # PC 미리보기용 사본 (pc/tests 가 같은지 검사)
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/screensaver/SCDream*.woff pc/tvrelay/screensaver/SCDream*.woff
          git commit -m "글꼴: 에스코어드림(S-Core Dream) 5 · 6 woff 를 화면보호기 폴더에 추가 (무료 배포 글꼴 · PC 가 TV 로 보냄)" || echo "변경 없음"
          git push
