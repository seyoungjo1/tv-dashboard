# 글꼴 받기: 에스코어드림(S-Core Dream, 무료 배포)을 눈누 CDN 에서 받아 앱 글꼴 폴더에 넣고 커밋한다 (작업 환경에서 바깥 다운로드가 막혀 있어 Actions 가 대신)
name: Fetch font
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SCDream 3 · 5 · 6 받기
        run: |
          set -e
          cd app/src/main/assets/fonts
          for w in 3 5 6; do
            curl -fsSL "https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.0/SCDream$w.woff" -o "SCDream$w.woff"
            file "SCDream$w.woff"; ls -la "SCDream$w.woff"
          done
          python3 - <<'PY'
          for w in (3, 5, 6):
              b = open(f"SCDream{w}.woff", "rb").read(4); assert b == b"wOFF", (w, b)
          print("ok")
          PY
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/fonts/SCDream*.woff
          git commit -m "글꼴: 에스코어드림(S-Core Dream) 3 · 5 · 6 woff 추가 (눈누 CDN, 무료 배포 글꼴)" || echo "변경 없음"
          git push
