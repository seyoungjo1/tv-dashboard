name: Android APK

# - 브랜치 push / PR    : 단위 테스트 + 디버그 APK 빌드(검증용, 아티팩트로 보관)
# - 태그 v1.2.3 push    : 서명된 Release APK 빌드 → GitHub Releases 게시 (+ update.json)
# - Actions 화면 수동 실행: 버전을 입력하면 서명된 Release APK 빌드, 'publish' 선택 시 Releases 게시
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.1). 비우면 디버그 빌드만 합니다."
        required: false
        default: ""
      publish:
        description: "GitHub Releases 에 게시 (태그 v<버전> 생성)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 모드 결정
        id: mode
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true; PUBLISH=true
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"; RELEASE=true; PUBLISH="${INPUT_PUBLISH:-false}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"; RELEASE=false; PUBLISH=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 1.2.3 형식이어야 합니다: $VERSION"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$(( MA * 1000000 + MI * 1000 + PA ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "### 버전 $VERSION (versionCode $CODE) · release=$RELEASE · publish=$PUBLISH" >> "$GITHUB_STEP_SUMMARY"

      - name: 단위 테스트 + 디버그 APK
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug -PappVersion=${{ steps.mode.outputs.version }}

      - name: 디버그 APK 보관
        uses: actions/upload-artifact@v4
        with:
          name: tv-dashboard-debug-${{ steps.mode.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ───────────────────────── 서명된 Release ─────────────────────────
      - name: 이전 릴리스보다 버전이 높은지 확인 (versionCode 증가 보장)
        if: steps.mode.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.mode.outputs.code }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::릴리스 v$VERSION 이 이미 있습니다. 버전을 올려 주세요."; exit 1
          fi
          LATEST=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [[ -n "$LATEST" && "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            PREV=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
            if (( CODE <= PREV )); then
              echo "::error::새 버전($VERSION)이 최신 릴리스($LATEST)보다 높아야 합니다."; exit 1
            fi
          fi

      - name: 서명 키 준비 (GitHub Secrets)
        if: steps.mode.outputs.release == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KEYSTORE_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!n}" ]]; then
              echo "::error::서명용 Secrets 가 없습니다. README 의 '서명 키 · Secrets 설정'을 참고해 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 를 등록하세요."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 서명된 Release APK 빌드
        if: steps.mode.outputs.release == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease -PappVersion=${{ steps.mode.outputs.version }}

      - name: 서명 검증 · update.json 생성
        if: steps.mode.outputs.release == 'true'
        id: out
        shell: bash
        env:
          VERSION: ${{ steps.mode.outputs.version }}
          CODE: ${{ steps.mode.outputs.code }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.jks"
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          [[ -f "$SRC" ]] || { echo "::error::서명된 APK 가 생성되지 않았습니다."; exit 1; }
          mkdir -p dist
          APK="tv-dashboard-v$VERSION.apk"
          cp "$SRC" "dist/$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "dist/$APK" | tee dist/signing-cert.txt
          SHA=$(sha256sum "dist/$APK" | cut -d' ' -f1)

          # 변경사항: release-notes/v<버전>.md 가 있으면 사용, 없으면 직전 태그 이후 커밋 제목
          if [[ -f "release-notes/v$VERSION.md" ]]; then
            cp "release-notes/v$VERSION.md" dist/notes.md
          else
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            RANGE=${PREV:+$PREV..HEAD}
            git log --no-merges --pretty='- %s' ${RANGE:-HEAD~20..HEAD} 2>/dev/null > dist/notes.md || true
            [[ -s dist/notes.md ]] || echo "- v$VERSION" > dist/notes.md
          fi

          python3 - "$VERSION" "$CODE" "$APK" "$SHA" <<'PY'
          import json, os, sys
          version, code, apk, sha = sys.argv[1:5]
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = open("dist/notes.md", encoding="utf-8").read().strip()
          info = {
              "versionName": version,
              "versionCode": int(code),
              "apkUrl": f"https://github.com/{repo}/releases/download/v{version}/{apk}",
              "sha256": sha,
              "notes": notes,
          }
          json.dump(info, open("dist/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cat dist/update.json
          echo "apk=dist/$APK" >> "$GITHUB_OUTPUT"

      - name: Release APK 보관
        if: steps.mode.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tv-dashboard-release-${{ steps.mode.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: GitHub Releases 게시
        if: steps.mode.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "${{ steps.out.outputs.apk }}" dist/update.json \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file dist/notes.md
          echo "게시 완료: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
