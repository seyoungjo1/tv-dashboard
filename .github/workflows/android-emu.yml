# 안드로이드 실기 시험: 에뮬레이터(Android 14)에 디버그 APK 를 깔고 실제 터치로 화면보호기 페이지를 시험한다
#  - 눈 버튼 → 쉬는 화면 · 마킹, 장면 넘김, 쉬는 화면 터치 → 끝, 달/해 버튼, 글꼴, JS 오류 없음
#  - 결과 그림(스크린샷)·콘솔·logcat 을 결과물로 남긴다
name: Android emulator test
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "app/src/main/assets/screensaver/**"
      - "app/src/main/java/**"
      - ".github/emu/**"
      - ".github/workflows/android-emu.yml"
concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: 디버그 APK
        run: ./gradlew -q assembleDirectDebug -PappVersion=$(cat pc/tvrelay/VERSION | sed 's/_p.*//')
      - name: 시험 자료 만들기 (동영상 · 설정.json · 공지)
        run: |
          set -x
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p emu-content/main
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 12 -c:v libx264 -profile:v main -level 4.0 -pix_fmt yuv420p -c:a aac -movflags +faststart emu-content/main/test.mp4
          printf '{"playlist":[{"src":"test.mp4"}],"rest":{"slides":["widget1","image"],"slideSec":5,"enabled":false,"runMin":10,"restMin":1,"city":"오산시","lat":37.1499,"lon":127.0771}}' > emu-content/main/설정.json
          printf '에뮬레이터 시험 공지 1\n에뮬레이터 시험 공지 2\n' > emu-content/main/공지.txt
          cp pc/tvrelay/VERSION emu-content/version.txt
          cat > emu-content/scale.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;font:15px sans-serif}#t{font-size:15px}@media(max-width:1199px){#t{font-size:24px}}</style></head>
          <body><h1 id="t">배율 시험 — 폭 1200 미만이면 글자가 커짐</h1><p id="v"></p>
          <script>v.textContent=innerWidth+'×'+innerHeight+' dpr '+devicePixelRatio</script></body></html>
          HTML
          ls -la emu-content/main
          python3 -m pip install -q websocket-client pillow
      - name: TV 에 깔린 것과 같은 최신 릴리스 APK 받기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(gh release list -R ${{ github.repository }} -L 1 --json tagName -q '.[0].tagName')
          echo "최신 릴리스: $TAG"
          gh release download "$TAG" -R ${{ github.repository }} -p 'tv-dashboard-*.apk' -O release.apk
          ls -la release.apk
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 시험
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash -c "bash .github/emu/run.sh emu-out; a=\$?; bash .github/emu/run_release.sh emu-out/release; b=\$?; echo debug=\$a release=\$b; exit \$((a|b))"
      - name: 결과물
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: emu-test, path: emu-out, if-no-files-found: ignore }
