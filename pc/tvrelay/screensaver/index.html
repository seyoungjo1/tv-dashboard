<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>화면보호기</title>
<!-- 대상 오산공장 Dashboard — 화면보호기 (자료/main 폴더가 있으면 대기 화면으로 표시)
     main/생산.json · sd.json · fi.json · plan.json  실적 대시보드 생성기의 JSON 4개 그대로
     main/1.mp4 2.mp4 …  오른쪽 동영상 (이름 오름차순, TV 기본 플레이어로 재생)
     main/공지.txt        왼쪽 위 공지 (한 줄에 하나)
     main/제목.txt        상단 제목 (없으면 '오산공장 스마트 현황판') -->
<link rel="stylesheet" href="ss.css">
</head>
<body>
<div id="stage">
  <header>
    <img id="logo" src="/data/logo.png" alt="" onerror="this.onerror=null;this.src='logo.png'">
    <h1 id="title">오산공장 스마트 현황판</h1>
    <div class="clock"><span id="date"></span><i></i><b id="time"></b></div>
  </header>

  <main>
    <section id="left">
      <div class="card" id="notice"></div>

      <div class="card" id="perf">
        <div class="asof" id="asOf"></div>
        <div class="half" id="sales">
          <h2>매출</h2>
          <div class="nums">
            <div class="n"><div class="nl">당월</div><div class="nv"><span class="count" id="s_m">0</span><small>억원</small></div><div class="badge" id="s_m_b"></div></div>
            <div class="n"><div class="nl">누계</div><div class="nv"><span class="count" id="s_y">0</span><small>억원</small></div><div class="badge" id="s_y_b"></div></div>
          </div>
          <div class="chartbox"><svg class="chart" id="s_chart"></svg></div>
        </div>
        <div class="vline"></div>
        <div class="half" id="prod">
          <h2>생산량</h2>
          <div class="nums">
            <div class="n"><div class="nl">당월</div><div class="nv"><span class="count" id="p_m">0</span><small>톤</small></div><div class="badge" id="p_m_b"></div></div>
            <div class="n"><div class="nl">누계</div><div class="nv"><span class="count" id="p_y">0</span><small>톤</small></div><div class="badge" id="p_y_b"></div></div>
          </div>
          <div class="chartbox"><svg class="chart" id="p_chart"></svg></div>
        </div>
        <div class="empty" id="perfEmpty">main 폴더에 생산.json · sd.json · fi.json · plan.json 을 넣으면 매출·생산 실적이 표시됩니다</div>
      </div>
    </section>

    <section id="right">
      <div id="video"><div class="ph" id="videoPh">main 폴더에 1.mp4, 2.mp4 … 를 넣으면<br>여기에 순서대로 재생됩니다</div></div>
    </section>
  </main>
  <div id="hint"></div>
</div>
<script src="ss.js"></script>
</body>
</html>
